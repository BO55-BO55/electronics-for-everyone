<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electronics For Everyone | Next Level</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        /* --- Root Variables --- */
        :root {
            --orange: #ff6600;
            --dark-orange: #e65c00;
            --cyan: #00ffff;
            --dark-cyan: #00e6e6;
            --white: #f0f0f0;
            --black: #0d0d0d;
            --dark-gray: #1a1a1a;
            --gray: #2c2c2c;
            --transparent-glass: rgba(44, 44, 44, 0.6);
            --border-color: rgba(255, 102, 0, 0.3);
            --shadow-color: rgba(255, 102, 0, 0.2);
            --transition-smooth: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Orbitron', monospace;
            background-color: var(--black);
            background-image:

                radial-gradient(ellipse at bottom right, rgba(0, 255, 255, 0.15) 0%, transparent 40%),

v-9H6v-1h9v-9H6V5zm10 1h9v9h-9V6zm10 0h9v9h-9V6zm10 0h9v9h-9V6zm10 0h9v9h-9V6zm10 0h9v9h-9V6zm10 0h9v9h-9V6zm10 0h9v9h-9V6zm10 0h9v9h-9V6zM6 16h9v9H6v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zM6 26h9v9H6v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zM6 36h9v9H6v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zM6 46h9v9H6v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zM6 56h9v9H6v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zM6 66h9v9H6v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zM6 76h9v9H6v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zM6 86h9v9H6v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9zm10 0h9v9h-9v-9z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            color: var(--white);

            
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* --- General Helper Classes --- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .icon {
            width: 1.2em;
            height: 1.2em;
            vertical-align: middle;
            margin-right: 8px;
        }

        /* --- Header --- */
        .header {
            background: rgba(13, 13, 13, 0.7);
            backdrop-filter: blur(10px);
            padding: 20px 0;
            border-bottom: 2px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            transition: var(--transition-smooth);
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        .logo-area {
            text-align: left;
        }
        
        .logo {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--orange);
            text-shadow: 0 0 10px var(--orange), 0 0 20px var(--orange);
            animation: glow 1.5s ease-in-out infinite alternate;
        }
        
        @keyframes glow {
            from { text-shadow: 0 0 5px var(--orange), 0 0 15px var(--orange); }
            to { text-shadow: 0 0 15px var(--orange), 0 0 25px var(--orange); }
        }
        
        .tagline {
            font-size: 1rem;
            color: var(--white);
            opacity: 0.8;
            margin-top: 5px;
            letter-spacing: 1px;
        }
        
        /* --- Navigation --- */
        .nav {
            display: flex;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 5px;
            border: 1px solid var(--border-color);
        }
        
        .nav button {
            background: transparent;
            border: none;
            color: var(--white);
            padding: 10px 20px;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            border-radius: 6px;
            transition: var(--transition-smooth);
            position: relative;
        }
        
        .nav button:hover {
            color: var(--orange);
        }

        .nav button.active {
            background: linear-gradient(45deg, var(--orange), var(--dark-orange));
            color: var(--black);
            box-shadow: 0 0 15px var(--shadow-color);
        }
        
        /* --- Main Content --- */
        .main {
            padding: 40px 0;
        }
        
        .content-section {
            display: none;
            animation: fadeIn 0.6s ease-out forwards;
        }

        .content-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Add Component Form --- */
        .add-component {
            background: var(--transparent-glass);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 40px;
        }
        
        .add-component h2 {
            color: var(--orange);
            margin-bottom: 30px;
            text-align: center;
            font-size: 2rem;
            font-weight: 900;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }
        
        .form-group label {
            color: var(--orange);
            margin-bottom: 10px;
            font-weight: 700;
            display: block;
        }
        
        .form-group input,
        .form-group textarea {
            background: rgba(0,0,0,0.5);
            border: 2px solid var(--gray);
            color: var(--white);
            padding: 12px;
            border-radius: 6px;
            font-family: 'Orbitron', monospace;
            transition: var(--transition-smooth);
            width: 100%;
        }
        
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--orange);
            box-shadow: 0 0 15px var(--shadow-color);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }
        
        /* --- Custom File Input --- */
        .file-input { display: none; }
        
        .file-input-label {
            background: transparent;
            border: 2px dashed var(--gray);
            color: var(--orange);
            padding: 20px;
            text-align: center;
            cursor: pointer;
            border-radius: 6px;
            transition: var(--transition-smooth);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100px;
        }
        
        .file-input-label:hover, .file-input-label.drag-over {
            background: rgba(255, 102, 0, 0.1);
            border-color: var(--orange);
        }

        .file-preview {
            margin-top: 10px;
            padding: 10px;
            background: var(--dark-gray);
            border-radius: 5px;
            font-size: 0.9rem;
            display: none;
            word-break: break-all;
        }
        .file-preview.show { display: block; }
        
        /* --- Submit Button --- */
        .submit-btn {
            grid-column: 1 / -1;
            background: linear-gradient(45deg, var(--orange), var(--dark-orange));
            border: none;
            color: var(--black);
            padding: 15px 30px;
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            border-radius: 6px;
            margin-top: 20px;
            transition: var(--transition-smooth);
            letter-spacing: 1px;
        }
        
        .submit-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px var(--shadow-color);
        }
        
        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* --- Loading Indicator --- */
        .loading {
            display: none;
            text-align: center;
            color: var(--orange);
            font-size: 1.5rem;
            margin: 40px 0;
            font-weight: 700;
        }
        .loading.show { display: block; }

        /* --- Components Section --- */
        .search-bar input {
            background: transparent;
            border: 2px solid var(--border-color);
            color: var(--white);
            padding: 15px 25px;
            border-radius: 50px;
            font-family: 'Orbitron', monospace;
            width: 100%;
            max-width: 500px;
            text-align: center;
            font-size: 1.1rem;
            display: block;
            margin: 0 auto 40px;
            transition: var(--transition-smooth);
        }
        
        .search-bar input:focus {
            outline: none;
            box-shadow: 0 0 20px var(--shadow-color);
            border-color: var(--orange);
        }
        
        .components-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }
        
        .component-card {
            background: var(--transparent-glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            transition: var(--transition-smooth);
            transform: perspective(1000px);
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(30px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        .component-card:hover {
            transform: translateY(-10px) rotateX(2deg) rotateY(3deg);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border-color: var(--orange);
        }
        
        .component-image {
            width: 100%;
            height: 200px;
            background: var(--black);
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid var(--border-color);
            overflow: hidden;
            position: relative;
        }

        .component-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.4s ease;
        }

        .component-card:hover .component-image img {
            transform: scale(1.05);
        }

        .placeholder-icon {
            font-size: 4rem;
            color: var(--orange);
            opacity: 0.7;
        }
        
        .component-info {
            padding: 20px;
        }
        
        .component-name {
            color: var(--orange);
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .component-description {
            color: var(--white);
            line-height: 1.6;
            margin-bottom: 20px;
            font-size: 0.9rem;
            opacity: 0.8;
            min-height: 60px; /* Ensures consistent card height */
        }
        
        .component-actions {
            display: flex;
            gap: 10px;
        }
        
        .action-btn {
            padding: 10px;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            border-radius: 6px;
            transition: var(--transition-smooth);
            border: none;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .download-btn {
            background: linear-gradient(45deg, var(--cyan), var(--dark-cyan));
            color: var(--black);
        }
        
        .download-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }
        
        .delete-btn {
            background: transparent;
            color: #ff5555;
            border: 1px solid #ff5555;
        }
        
        .delete-btn:hover {
            background: #ff5555;
            color: var(--white);
        }
        
        /* --- Footer --- */
        .footer {
            background: var(--black);
            text-align: center;
            padding: 30px 0;
            margin-top: 60px;
            border-top: 1px solid var(--border-color);
        }
        
        .footer p {
            color: var(--orange);
            font-weight: 400;
            opacity: 0.7;
            letter-spacing: 1px;
        }
        
        /* --- Notification --- */
        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(45deg, var(--orange), var(--dark-orange));
            color: var(--black);
            padding: 15px 25px;
            border-radius: 8px;
            font-weight: 700;
            transform: translateX(calc(100% + 30px));
            transition: transform 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 1001;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        .notification.show { transform: translateX(0); }
        .notification.error { background: linear-gradient(45deg, #ff3333, #cc0000); color: var(--white); }
        
        /* --- Responsive Design --- */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                text-align: center;
            }
            .logo { font-size: 2rem; }
            .nav { justify-content: center; }
            .form-grid { grid-template-columns: 1fr; }
            .components-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo-area">
                    <h1 class="logo">ELECTRONICS FOR EVERYONE</h1>
                    <p class="tagline">Universal CAD Component Library</p>
                </div>
                <nav class="nav">
                    <button id="browseBtn" class="active">Browse</button>
                    <button id="addBtn">Add New</button>
                </nav>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div class="loading" id="loading">LOADING COMPONENTS...</div>
            
            <section class="content-section add-component" id="addComponentSection">
                <h2>Add New Component</h2>
                <form id="componentForm" class="form-grid" enctype="multipart/form-data">
                    <div class="form-group">
                        <label for="componentName">Component Name</label>
                        <input type="text" id="componentName" required placeholder="e.g., Arduino Uno R3">
                    </div>
                    
                    <div class="form-group">
                        <label for="componentImage">Component Image (Optional)</label>
                        <input type="file" id="componentImage" class="file-input" accept="image/*">
                        <label for="componentImage" class="file-input-label">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                            Upload Image or Drag & Drop
                        </label>
                        <div class="file-preview" id="imagePreview"></div>
                    </div>
                    
                    <div class="form-group">
                        <label for="componentFile">CAD File</label>
                        <input type="file" id="componentFile" class="file-input" required accept=".dwg,.dxf,.step,.stp,.iges,.igs,.f3d,.ipt,.asm,.prt,.sldprt,.sldasm,.catpart,.catproduct,.3dm,.skp,.blend">
                        <label for="componentFile" class="file-input-label">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
                            Upload CAD File or Drag & Drop
                        </label>
                        <div class="file-preview" id="filePreview"></div>
                    </div>
                    
                    <div class="form-group" style="grid-column: 1 / -1;">
                        <label for="componentDescription">Description</label>
                        <textarea id="componentDescription" required placeholder="Describe the component, its specifications, and usage..."></textarea>
                    </div>
                    
                    <button type="submit" class="submit-btn" id="submitBtn">Add Component</button>
                </form>
            </section>

            <section class="content-section components-section active" id="componentsSection">
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Search components by name or description...">
                </div>
                
                <div class="components-grid" id="componentsGrid">
                    </div>
            </section>
        </div>
    </main>

    <div class="notification" id="notification"></div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Electronics For Everyone | Sharing Knowledge, Building Tomorrow</p>
        </div>
    </footer>

    <script>
        // --- All JavaScript functionality remains the same ---
        const API_BASE = window.location.origin;

        const browseBtn = document.getElementById('browseBtn');
        const addBtn = document.getElementById('addBtn');
        const addComponentSection = document.getElementById('addComponentSection');
        const componentsSection = document.getElementById('componentsSection');
        const componentForm = document.getElementById('componentForm');
        const componentsGrid = document.getElementById('componentsGrid');
        const searchInput = document.getElementById('searchInput');
        const loading = document.getElementById('loading');
        const notification = document.getElementById('notification');

        browseBtn.addEventListener('click', () => {
            browseBtn.classList.add('active');
            addBtn.classList.remove('active');
            addComponentSection.classList.remove('active');
            componentsSection.classList.add('active');
            loadComponents();
        });

        addBtn.addEventListener('click', () => {
            addBtn.classList.add('active');
            browseBtn.classList.remove('active');
            addComponentSection.classList.add('active');
            componentsSection.classList.remove('active');
        });

        function setupFileInput(inputId, previewId) {
            const input = document.getElementById(inputId);
            const label = input.nextElementSibling;
            const preview = document.getElementById(previewId);

            input.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    preview.textContent = `Selected: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
                    preview.classList.add('show');
                }
            });

            label.addEventListener('dragover', (e) => {
                e.preventDefault();
                label.classList.add('drag-over');
            });

            label.addEventListener('dragleave', () => label.classList.remove('drag-over'));
            
            label.addEventListener('drop', (e) => {
                e.preventDefault();
                label.classList.remove('drag-over');
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    input.files = files;
                    const file = files[0];
                    preview.textContent = `Selected: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
                    preview.classList.add('show');
                }
            });
        }
        setupFileInput('componentImage', 'imagePreview');
        setupFileInput('componentFile', 'filePreview');

        function showNotification(message, isError = false) {
            notification.textContent = message;
            notification.className = `notification${isError ? ' error' : ''}`;
            notification.classList.add('show');
            setTimeout(() => notification.classList.remove('show'), 3000);
        }

        function showLoading(show = true) {
            loading.classList.toggle('show', show);
        }

        componentForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Uploading...';
            
            const formData = new FormData();
            formData.append('name', document.getElementById('componentName').value);
            formData.append('description', document.getElementById('componentDescription').value);
            const imageFile = document.getElementById('componentImage').files[0];
            const cadFile = document.getElementById('componentFile').files[0];
            if (imageFile) formData.append('image', imageFile);
            if (cadFile) formData.append('cadFile', cadFile);

            try {
                const response = await fetch(`${API_BASE}/api/components`, {
                    method: 'POST',
                    body: formData
                });
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Failed to add component');
                }
                showNotification('Component added successfully!');
                componentForm.reset();
                document.getElementById('imagePreview').classList.remove('show');
                document.getElementById('filePreview').classList.remove('show');
                browseBtn.click();
            } catch (error) {
                console.error('Error adding component:', error);
                showNotification(error.message, true);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Add Component';
            }
        });

        let searchTimeout;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => loadComponents(e.target.value), 300);
        });

        async function loadComponents(search = '') {
            showLoading(true);
            try {
                const url = search ? 
                    `${API_BASE}/api/components?search=${encodeURIComponent(search)}` :
                    `${API_BASE}/api/components`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('Failed to load components');
                const components = await response.json();
                renderComponents(components);
            } catch (error) {
                console.error('Error loading components:', error);
                showNotification('Failed to load components', true);
                componentsGrid.innerHTML = `<p style="text-align: center; color: var(--orange); font-size: 1.2rem; grid-column: 1 / -1;">Failed to load components. Please try again.</p>`;
            } finally {
                showLoading(false);
            }
        }

        function renderComponents(components) {
            componentsGrid.innerHTML = '';
            if (components.length === 0) {
                componentsGrid.innerHTML = `<p style="text-align: center; color: var(--orange); font-size: 1.2rem; grid-column: 1 / -1;">No components found. Add one to get started!</p>`;
                return;
            }
            components.forEach(component => {
                const componentCard = document.createElement('div');
                componentCard.className = 'component-card';
                
                // Handle both Cloudinary URLs (full URLs) and local paths (relative URLs)
                let imageUrl = '';
                if (component.image_path) {
                    if (component.image_path.startsWith('http://') || component.image_path.startsWith('https://')) {
                        // Cloudinary URL - use as is
                        imageUrl = component.image_path;
                    } else {
                        // Local path - prepend API_BASE
                        imageUrl = `${API_BASE}/${component.image_path}`;
                    }
                }
                
                componentCard.innerHTML = `
                    <div class="component-image">
                        ${imageUrl ? 
                          `<img src="${imageUrl}" alt="${component.name}" loading="lazy" onerror="this.parentNode.innerHTML='<div class=\\'placeholder-icon\\'>⚡</div>'"/>` :
                          `<div class="placeholder-icon">⚡</div>`
                        }
                    </div>
                    <div class="component-info">
                        <h3 class="component-name">${component.name}</h3>
                        <p class="component-description">${component.description}</p>
                        <div class="component-actions">
                            <button class="action-btn download-btn" onclick="downloadComponent(${component.id})">
                                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                                <span>Download</span>
                            </button>
                            <button class="action-btn delete-btn" onclick="deleteComponent(${component.id})">
                                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                                <span>Delete</span>
                            </button>
                        </div>
                    </div>`;
                componentsGrid.appendChild(componentCard);
            });
        }

        async function downloadComponent(componentId) {
            try {
                const response = await fetch(`${API_BASE}/api/download/${componentId}`);
                if (!response.ok) throw new Error('Failed to download file');
                const blob = await response.blob();
                const contentDisposition = response.headers.get('content-disposition');
                const filename = contentDisposition ? contentDisposition.split('filename=')[1].replace(/"/g, '') : 'component.cad';
                const url = window.URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                window.URL.revokeObjectURL(url);
                showNotification('Download started!');
            } catch (error) {
                console.error('Error downloading component:', error);
                showNotification('Failed to download file', true);
            }
        }

        async function deleteComponent(componentId) {
            if (!confirm('Are you sure you want to delete this component? This action cannot be undone.')) return;
            try {
                const response = await fetch(`${API_BASE}/api/components/${componentId}`, { method: 'DELETE' });
                if (!response.ok) throw new Error('Failed to delete component');
                showNotification('Component deleted successfully!');
                loadComponents(searchInput.value);
            } catch (error) {
                console.error('Error deleting component:', error);
                showNotification('Failed to delete component', true);
            }
        }

        document.addEventListener('DOMContentLoaded', () => loadComponents());
    </script>
</body>
</html>
