<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electronics For Everyone</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --orange: #ff6600;
            --dark-orange: #cc5200;
            --light-orange: #ff8533;
            --white: #ffffff;
            --black: #000000;
            --dark-gray: #1a1a1a;
            --gray: #333333;
        }
        
        body {
            font-family: 'Orbitron', monospace;
            background: linear-gradient(135deg, var(--black) 0%, var(--dark-gray) 100%);
            color: var(--white);
            min-height: 100vh;
        }
        
        /* Retro scanline effect */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(255, 102, 0, 0.03) 2px,
                rgba(255, 102, 0, 0.03) 4px
            );
            pointer-events: none;
            z-index: 1000;
        }
        
        /* Header */
        .header {
            background: linear-gradient(90deg, var(--black), var(--gray), var(--black));
            padding: 20px 0;
            border-bottom: 3px solid var(--orange);
            position: relative;
            overflow: hidden;
        }
        
        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, var(--orange), transparent);
            opacity: 0.1;
            animation: sweep 3s infinite;
        }
        
        @keyframes sweep {
            0% { left: -100%; }
            100% { left: 100%; }
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .logo {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--orange);
            text-shadow: 0 0 10px var(--orange), 0 0 20px var(--orange);
            animation: glow 2s ease-in-out infinite alternate;
        }
        
        @keyframes glow {
            from { text-shadow: 0 0 10px var(--orange), 0 0 20px var(--orange); }
            to { text-shadow: 0 0 20px var(--orange), 0 0 30px var(--orange); }
        }
        
        .tagline {
            font-size: 1.2rem;
            color: var(--white);
            margin-top: 5px;
        }
        
        /* Navigation */
        .nav {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
        
        .nav button {
            background: linear-gradient(45deg, var(--orange), var(--dark-orange));
            border: none;
            color: var(--white);
            padding: 10px 20px;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            border-radius: 5px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .nav button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.3s ease;
        }
        
        .nav button:hover::before {
            left: 100%;
        }
        
        .nav button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 102, 0, 0.4);
        }
        
        .nav button.active {
            background: var(--white);
            color: var(--black);
        }
        
        /* Main Content */
        .main {
            padding: 40px 0;
        }
        
        /* Add Component Form */
        .add-component {
            background: linear-gradient(135deg, var(--gray), var(--dark-gray));
            padding: 30px;
            margin-bottom: 40px;
            border-radius: 10px;
            border: 2px solid var(--orange);
            display: none;
        }
        
        .add-component.active {
            display: block;
        }
        
        .add-component h2 {
            color: var(--orange);
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.8rem;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        .form-group label {
            color: var(--orange);
            margin-bottom: 5px;
            font-weight: 700;
        }
        
        .form-group input,
        .form-group textarea {
            background: var(--black);
            border: 2px solid var(--gray);
            color: var(--white);
            padding: 10px;
            border-radius: 5px;
            font-family: 'Orbitron', monospace;
            transition: border-color 0.3s ease;
        }
        
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--orange);
            box-shadow: 0 0 10px rgba(255, 102, 0, 0.3);
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        /* File input styling */
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }
        
        .file-input {
            position: absolute;
            left: -9999px;
        }
        
        .file-input-label {
            background: var(--black);
            border: 2px dashed var(--orange);
            color: var(--orange);
            padding: 20px;
            text-align: center;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
            display: block;
        }
        
        .file-input-label:hover {
            background: var(--dark-gray);
            border-color: var(--light-orange);
        }
        
        .file-input-label.drag-over {
            background: var(--dark-gray);
            border-color: var(--light-orange);
            transform: scale(1.02);
        }
        
        .file-preview {
            margin-top: 10px;
            padding: 10px;
            background: var(--dark-gray);
            border-radius: 5px;
            font-size: 0.9rem;
            display: none;
        }
        
        .file-preview.show {
            display: block;
        }
        
        .submit-btn {
            grid-column: 1 / -1;
            background: linear-gradient(45deg, var(--orange), var(--dark-orange));
            border: none;
            color: var(--white);
            padding: 15px 30px;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            border-radius: 5px;
            margin-top: 20px;
            transition: all 0.3s ease;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 102, 0, 0.4);
        }
        
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        /* Loading indicator */
        .loading {
            display: none;
            text-align: center;
            color: var(--orange);
            font-size: 1.2rem;
            margin: 20px 0;
        }
        
        .loading.show {
            display: block;
        }
        
        /* Components Grid */
        .components-section {
            display: block;
        }
        
        .components-section.hidden {
            display: none;
        }
        
        .search-bar {
            margin-bottom: 30px;
            text-align: center;
        }
        
        .search-bar input {
            background: var(--black);
            border: 2px solid var(--orange);
            color: var(--white);
            padding: 15px 20px;
            border-radius: 25px;
            font-family: 'Orbitron', monospace;
            width: 100%;
            max-width: 400px;
            text-align: center;
            font-size: 1rem;
        }
        
        .search-bar input:focus {
            outline: none;
            box-shadow: 0 0 20px rgba(255, 102, 0, 0.5);
        }
        
        .components-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }
        
        .component-card {
            background: linear-gradient(135deg, var(--gray), var(--dark-gray));
            border: 2px solid var(--orange);
            border-radius: 10px;
            overflow: hidden;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .component-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--orange), var(--light-orange), var(--orange));
        }
        
        .component-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(255, 102, 0, 0.3);
            border-color: var(--light-orange);
        }
        
        .component-image {
            width: 100%;
            height: 200px;
            background: var(--black);
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid var(--orange);
            overflow: hidden;
        }
        
        .component-image img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        .placeholder-icon {
            font-size: 4rem;
            color: var(--orange);
            opacity: 0.7;
        }
        
        .component-info {
            padding: 20px;
        }
        
        .component-name {
            color: var(--orange);
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .component-description {
            color: var(--white);
            line-height: 1.6;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }
        
        .component-actions {
            display: flex;
            gap: 10px;
        }
        
        .download-btn, .delete-btn {
            padding: 10px 20px;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            border-radius: 5px;
            transition: all 0.3s ease;
            border: none;
            flex: 1;
        }
        
        .download-btn {
            background: linear-gradient(45deg, var(--orange), var(--dark-orange));
            color: var(--white);
        }
        
        .download-btn:hover {
            background: var(--white);
            color: var(--black);
        }
        
        .delete-btn {
            background: linear-gradient(45deg, #ff3333, #cc0000);
            color: var(--white);
        }
        
        .delete-btn:hover {
            background: var(--white);
            color: #cc0000;
        }
        
        /* Footer */
        .footer {
            background: var(--black);
            text-align: center;
            padding: 20px 0;
            margin-top: 60px;
            border-top: 2px solid var(--orange);
        }
        
        .footer p {
            color: var(--orange);
            font-weight: 700;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .header-content {
                text-align: center;
            }
            
            .logo {
                font-size: 2rem;
            }
            
            .nav {
                justify-content: center;
                flex-wrap: wrap;
            }
            
            .form-grid {
                grid-template-columns: 1fr;
            }
            
            .components-grid {
                grid-template-columns: 1fr;
            }
            
            .component-actions {
                flex-direction: column;
            }
        }
        
        /* Animation for new components */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .component-card.new {
            animation: slideIn 0.5s ease-out;
        }
        
        /* Notification */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--orange);
            color: var(--white);
            padding: 15px 20px;
            border-radius: 5px;
            font-weight: 700;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            z-index: 1001;
        }
        
        .notification.show {
            transform: translateX(0);
        }
        
        .notification.error {
            background: #ff3333;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div>
                    <h1 class="logo">ELECTRONICS FOR EVERYONE</h1>
                    <p class="tagline">Universal CAD Component Library</p>
                </div>
                <nav class="nav">
                    <button id="browseBtn" class="active">Browse Components</button>
                    <button id="addBtn">Add Component</button>
                </nav>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <!-- Loading indicator -->
            <div class="loading" id="loading">Loading...</div>
            
            <!-- Add Component Form -->
            <section class="add-component" id="addComponentSection">
                <h2>Add New Component</h2>
                <form id="componentForm" class="form-grid" enctype="multipart/form-data">
                    <div class="form-group">
                        <label for="componentName">Component Name</label>
                        <input type="text" id="componentName" required placeholder="e.g., Arduino Uno R3">
                    </div>
                    
                    <div class="form-group">
                        <label for="componentImage">Component Image</label>
                        <div class="file-input-wrapper">
                            <input type="file" id="componentImage" class="file-input" accept="image/*">
                            <label for="componentImage" class="file-input-label">
                                📷 Click to upload image or drag & drop
                            </label>
                            <div class="file-preview" id="imagePreview"></div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="componentFile">CAD File</label>
                        <div class="file-input-wrapper">
                            <input type="file" id="componentFile" class="file-input" required 
                                   accept=".dwg,.dxf,.step,.stp,.iges,.igs,.f3d,.ipt,.asm,.prt,.sldprt,.sldasm,.catpart,.catproduct,.3dm,.skp,.blend">
                            <label for="componentFile" class="file-input-label">
                                📁 Click to upload CAD file or drag & drop
                            </label>
                            <div class="file-preview" id="filePreview"></div>
                        </div>
                    </div>
                    
                    <div class="form-group" style="grid-column: 1 / -1;">
                        <label for="componentDescription">Description</label>
                        <textarea id="componentDescription" required placeholder="Describe the component, its specifications, and usage..."></textarea>
                    </div>
                    
                    <button type="submit" class="submit-btn" id="submitBtn">Add Component</button>
                </form>
            </section>

            <!-- Browse Components -->
            <section class="components-section" id="componentsSection">
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Search components...">
                </div>
                
                <div class="components-grid" id="componentsGrid">
                    <!-- Components will be loaded here -->
                </div>
            </section>
        </div>
    </main>

    <!-- Notification -->
    <div class="notification" id="notification"></div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Electronics For Everyone | Sharing Knowledge, Building Tomorrow</p>
        </div>
    </footer>

    <script>
        // API base URL
        const API_BASE = window.location.origin;

        // DOM elements
        const browseBtn = document.getElementById('browseBtn');
        const addBtn = document.getElementById('addBtn');
        const addComponentSection = document.getElementById('addComponentSection');
        const componentsSection = document.getElementById('componentsSection');
        const componentForm = document.getElementById('componentForm');
        const componentsGrid = document.getElementById('componentsGrid');
        const searchInput = document.getElementById('searchInput');
        const loading = document.getElementById('loading');
        const notification = document.getElementById('notification');

        // Navigation functionality
        browseBtn.addEventListener('click', () => {
            browseBtn.classList.add('active');
            addBtn.classList.remove('active');
            addComponentSection.classList.remove('active');
            componentsSection.classList.remove('hidden');
            loadComponents();
        });

        addBtn.addEventListener('click', () => {
            addBtn.classList.add('active');
            browseBtn.classList.remove('active');
            addComponentSection.classList.add('active');
            componentsSection.classList.add('hidden');
        });

        // File upload handling
        function setupFileInput(inputId, previewId) {
            const input = document.getElementById(inputId);
            const label = input.nextElementSibling;
            const preview = document.getElementById(previewId);

            input.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    preview.textContent = `Selected: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
                    preview.classList.add('show');
                }
            });

            // Drag and drop
            label.addEventListener('dragover', (e) => {
                e.preventDefault();
                label.classList.add('drag-over');
            });

            label.addEventListener('dragleave', () => {
                label.classList.remove('drag-over');
            });

            label.addEventListener('drop', (e) => {
                e.preventDefault();
                label.classList.remove('drag-over');
                
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    input.files = files;
                    const file = files[0];
                    preview.textContent = `Selected: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
                    preview.classList.add('show');
                }
            });
        }

        setupFileInput('componentImage', 'imagePreview');
        setupFileInput('componentFile', 'filePreview');

        // Show notification
        function showNotification(message, isError = false) {
            notification.textContent = message;
            notification.className = `notification${isError ? ' error' : ''}`;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // Show loading
        function showLoading(show = true) {
            loading.classList.toggle('show', show);
        }

        // Form submission
        componentForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Uploading...';
            
            const formData = new FormData();
            formData.append('name', document.getElementById('componentName').value);
            formData.append('description', document.getElementById('componentDescription').value);
            
            const imageFile = document.getElementById('componentImage').files[0];
            const cadFile = document.getElementById('componentFile').files[0];
            
            if (imageFile) {
                formData.append('image', imageFile);
            }
            
            if (cadFile) {
                formData.append('cadFile', cadFile);
            }

            try {
                const response = await fetch(`${API_BASE}/api/components`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Failed to add component');
                }

                const newComponent = await response.json();
                showNotification('Component added successfully!');
                componentForm.reset();
                document.getElementById('imagePreview').classList.remove('show');
                document.getElementById('filePreview').classList.remove('show');
                
                // Switch to browse view
                browseBtn.click();
                
            } catch (error) {
                console.error('Error adding component:', error);
                showNotification(error.message, true);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Add Component';
            }
        });

        // Search functionality
        let searchTimeout;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                loadComponents(e.target.value);
            }, 300);
        });

        // Load components from API
        async function loadComponents(search = '') {
            showLoading(true);
            
            try {
                const url = search ? 
                    `${API_BASE}/api/components?search=${encodeURIComponent(search)}` :
                    `${API_BASE}/api/components`;
                
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error('Failed to load components');
                }
                
                const components = await response.json();
                renderComponents(components);
                
            } catch (error) {
                console.error('Error loading components:', error);
                showNotification('Failed to load components', true);
                componentsGrid.innerHTML = '<p style="text-align: center; color: var(--orange); font-size: 1.2rem; grid-column: 1 / -1;">Failed to load components. Please try again.</p>';
            } finally {
                showLoading(false);
            }
        }

        // Render components
        function renderComponents(components) {
            componentsGrid.innerHTML = '';
            
            if (components.length === 0) {
                componentsGrid.innerHTML = '<p style="text-align: center; color: var(--orange); font-size: 1.2rem; grid-column: 1 / -1;">No components found. Add some components to get started!</p>';
                return;
            }
            
            components.forEach(component => {
                const componentCard = document.createElement('div');
                componentCard.className = 'component-card';
                
                const imageUrl = component.image_path ? 
                    `${API_BASE}/${component.image_path}` : '';
                
                componentCard.innerHTML = `
                    <div class="component-image">
                        ${imageUrl ? 
                            `<img src="${imageUrl}" alt="${component.name}" onerror="this.parentNode.innerHTML='<div class=\\'placeholder-icon\\'>⚡</div>'">` :
                            `<div class="placeholder-icon">⚡</div>`
                        }
                    </div>
                    <div class="component-info">
                        <h3 class="component-name">${component.name}</h3>
                        <p class="component-description">${component.description}</p>
                        <div class="component-actions">
                            <button class="download-btn" onclick="downloadComponent(${component.id})">
                                Download ${component.original_filename}
                            </button>
                            <button class="delete-btn" onclick="deleteComponent(${component.id})">
                                Delete
                            </button>
                        </div>
                    </div>
                `;
                
                componentsGrid.appendChild(componentCard);
            });
        }

        // Download component
        async function downloadComponent(componentId) {
            try {
                const response = await fetch(`${API_BASE}/api/download/${componentId}`);
                
                if (!response.ok) {
                    throw new Error('Failed to download file');
                }
                
                const blob = await response.blob();
                const contentDisposition = response.headers.get('content-disposition');
                const filename = contentDisposition ? 
                    contentDisposition.split('filename=')[1].replace(/"/g, '') :
                    'component.cad';
                
                const url = window.URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                window.URL.revokeObjectURL(url);
                
                showNotification('Download started!');
                
            } catch (error) {
                console.error('Error downloading component:', error);
                showNotification('Failed to download file', true);
            }
        }

        // Delete component
        async function deleteComponent(componentId) {
            if (!confirm('Are you sure you want to delete this component? This action cannot be undone.')) {
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/api/components/${componentId}`, {
                    method: 'DELETE'
                });
                
                if (!response.ok) {
                    throw new Error('Failed to delete component');
                }
                
                showNotification('Component deleted successfully!');
                loadComponents(searchInput.value);
                
            } catch (error) {
                console.error('Error deleting component:', error);
                showNotification('Failed to delete component', true);
            }
        }

        // Initialize the page
        document.addEventListener('DOMContentLoaded', () => {
            loadComponents();
        });
    </script>
</body>
</html>
